[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openthermal"
version = "0.1.0"
description = "Print on LX-D02 family Bluetooth thermal printers (Dolewa / Funny Print compatible)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["bleak>=0.22", "pillow>=10"]

[project.scripts]
otps = "openthermal.cli:main"

[tool.setuptools]
packages = ["openthermal"]
