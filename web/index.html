<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenThermalPrinterStudio</title>
  <meta name="description" content="Design banners, labels and pictures and print them on LX-D02 family Bluetooth thermal printers, straight from the browser.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <h1 class="mark">Open<b>Thermal</b>Printer<span>Studio</span></h1>
    <button id="connect" class="pill" type="button">
      <span class="dot" aria-hidden="true"></span>
      <span id="connect-label">Connect printer</span>
      <span id="battery" class="battery" hidden></span>
    </button>
  </header>

  <p id="unsupported" class="notice" hidden>
    This browser can't talk to Bluetooth printers. Open the studio in Chrome or Edge on a computer or Android phone to print. You can still design and save PNGs here.
  </p>

  <main class="studio">
    <section class="composer" aria-label="Design">
      <div class="modes" role="tablist" aria-label="What to print">
        <button role="tab" aria-selected="true" data-mode="banner">Banner</button>
        <button role="tab" aria-selected="false" data-mode="label">Label</button>
        <button role="tab" aria-selected="false" data-mode="image">Picture</button>
      </div>

      <div class="panel" data-panel="banner">
        <label class="field">
          <span>Text along the strip</span>
          <input id="banner-text" type="text" value="ACHTUNG LEBENSMITTEL" autocomplete="off">
        </label>
        <div class="row">
          <label class="field grow">
            <span>Typeface</span>
            <select id="banner-font" class="font-select"></select>
          </label>
          <label class="check"><input id="banner-border" type="checkbox" checked> Frame</label>
        </div>
      </div>

      <div class="panel" data-panel="label" hidden>
        <label class="field">
          <span>Text across the paper</span>
          <textarea id="label-text" rows="3">Frisch
16.10.2026</textarea>
        </label>
        <div class="row">
          <label class="field grow">
            <span>Typeface</span>
            <select id="label-font" class="font-select"></select>
          </label>
          <label class="field">
            <span>Align</span>
            <select id="label-align">
              <option value="left">Left</option>
              <option value="center" selected>Center</option>
              <option value="right">Right</option>
            </select>
          </label>
        </div>
        <label class="field">
          <span>Size <output id="label-size-out">64</output> px</span>
          <input id="label-size" type="range" min="16" max="160" step="2" value="64">
        </label>
        <label class="check"><input id="label-border" type="checkbox"> Frame</label>
      </div>

      <div class="panel" data-panel="image" hidden>
        <label class="drop" id="drop">
          <input id="image-file" type="file" accept="image/*">
          <strong>Choose a picture</strong>
          <span>or drop it here. It is scaled to the 58&nbsp;mm paper width.</span>
        </label>
        <div class="row">
          <label class="check"><input id="image-dither" type="checkbox" checked> Dither for photos</label>
          <label class="check"><input id="image-invert" type="checkbox"> Invert</label>
        </div>
        <label class="field">
          <span>Threshold <output id="image-threshold-out">128</output></span>
          <input id="image-threshold" type="range" min="16" max="240" value="128">
        </label>
      </div>

      <div class="divider"></div>

      <label class="field">
        <span>Darkness <output id="density-out">3</output> of 7</span>
        <input id="density" type="range" min="1" max="7" value="3">
      </label>

      <div class="actions">
        <button id="print" class="primary" type="button">Print</button>
        <button id="save" class="ghost" type="button">Save PNG</button>
      </div>

      <ol id="log" class="log" aria-live="polite"></ol>
    </section>

    <section class="stage" aria-label="Print preview">
      <div class="printer" aria-hidden="true">
        <div class="slot"></div>
      </div>
      <div class="strip-wrap">
        <div class="strip" id="strip">
          <canvas id="preview" width="384" height="384"></canvas>
          <div class="head" id="head" hidden></div>
        </div>
      </div>
      <p class="meta" id="meta"></p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
